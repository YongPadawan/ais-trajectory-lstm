[project]
name = "ais-traj"
version = "1.0.0"
description = "Vessel trajectory prediction with LSTM networks on Danish AIS data"
requires-python = ">=3.10,<3.13"
dependencies = [
    "tensorflow>=2.16,<2.20",
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
gpu = ["tensorflow[and-cuda]>=2.16,<2.20"]
notebook = ["jupyter", "seaborn"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
